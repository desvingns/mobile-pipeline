name: pages

# Publish the node-view graph at the site root and the presentation at /showcase/.
# Both remain usable straight from disk; Pages is the shareable copy.

on:
  push:
    branches: [ main ]
    paths:
      - 'graph/**'
      - 'showcase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — the graph must be in sync with templates/
        run: bash tests/test-graph.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          set -e
          mkdir -p _site/showcase
          cp -R graph/. _site/
          cp showcase/index.html _site/showcase/
          cp -R showcase/assets showcase/media _site/showcase/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
