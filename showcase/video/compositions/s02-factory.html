            lr = H.rng(7 + n * 13);
            var sx = (lr() - 0.5) * 1300, sy = -30 + lr() * 400, rot = (lr() - 0.5) * 160, t0 = 0.12 + n * 0.05;
            tl.fromTo(L, { x: sx, y: sy, rotation: rot, scale: 0, opacity: 0 }, { x: sx * 0.86, y: sy * 0.86, rotation: rot * 0.8, scale: 0.72, opacity: 1, duration: 0.45, ease: "back.out(2)" }, t0);
            to(L, { x: sx * 0.86, y: sy * 0.86, rotation: rot * 0.8, scale: 0.72 }, { x: sx * 0.7, y: sy * 0.7, rotation: rot * 0.6, scale: 0.78, duration: C.brand - 0.26 - t0 - 0.45, ease: "sine.inOut" }, t0 + 0.45);
            to(L, { x: sx * 0.7, y: sy * 0.7, rotation: rot * 0.6, scale: 0.78 }, { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.26, ease: "power4.in" }, C.brand - 0.26);
          });
          to("#s02-factory-word", { scale: 1, y: 0 }, { scale: 1.07, y: -6, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, C.brand);
          tl.fromTo("#s02-factory-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, C.brand + 0.08);

          // ---- factory: the chip and the factory rise, windows switch on, smoke puffs ----
          tl.fromTo("#s02-factory-pill", { scale: 0.4, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.9)" }, C.factory - 0.05);
          tl.fromTo("#s02-factory-fac", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, C.factory + 0.05);
          document.querySelectorAll("#s02-factory-wins rect, #s02-factory-wins circle").forEach(function (w, n) { tl.fromTo(w, { attr: { fill: P.cream } }, { attr: { fill: n % 2 ? P.mint : P.sky }, duration: 0.01 }, C.factory + 0.55 + n * 0.12); });
          document.querySelectorAll("#s02-factory .puff").forEach(function (p, n) {
            var st = xf(p, { s: 0.4, o: 0 }), pd = { p: 0 };
            tl.fromTo(pd, { p: 0 }, { p: 1, duration: 1.5, ease: "none", immediateRender: false, repeat: H.repeats(C.n49 - C.factory - 0.8 - n * 0.5, 1.5), onUpdate: function () {
              var q = pd.p; st.y = -50 * q; st.x = 160 * q; st.s = 0.4 + q; st.o = q < 0.15 ? q / 0.15 * 0.95 : 0.95 * (1 - (q - 0.15) / 0.85); st.apply(); } }, C.factory + 0.6 + n * 0.5);
          });

          // ---- «В её каталоге»: the camera dives through the factory door (it fills the frame with ink), the catalogue opens behind it ----
          to("#s02-factory-ext", { scale: 1 }, { scale: 34, duration: 0.62, ease: "power3.in" }, C.n49 - 1.1);
          to("#s02-factory-ext", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, C.n49 - 0.48);
          to("#s02-factory-knob", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, C.n49 - 0.9);
          tl.fromTo("#s02-factory-cat", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, C.n49 - 0.46);

          // ---- n49: «49» counts up while it grows (counting-dynamic-scale) · team: the grid blooms from the centre ----
          var n49 = id("n49"), box = { v: 0 };
          tl.fromTo(box, { v: 0 }, { v: 49, duration: 1.2, ease: "power3.out", immediateRender: false, onUpdate: function () { n49.textContent = String(Math.round(box.v)); } }, C.n49);
          tl.fromTo("#s02-factory-n49", { scale: 0.5 }, { scale: 1, duration: 1.2, ease: "power3.out" }, C.n49);
          H.slam(tl, "#s02-factory-lbl", C.team, { dur: 0.34 });
          tiles.forEach(function (t, n) {
            var col = n % 7, row = Math.floor(n / 7), ring = Math.max(Math.abs(col - 3), Math.abs(row - 3));
            tl.fromTo(t, { x: (3 - col) * 74 * 0.55, y: (3 - row) * 86 * 0.55, scale: 0, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, C.team - 0.05 + ring * 0.1 + tr() * 0.06);
            to(t, { y: 0 }, { y: -14, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, (n < 22 ? C.team + 0.78 : C.team + 1.18) + col * 0.025);
          });
          tl.fromTo("#s02-factory-leg1", { scale: 0.3, opacity: 0, x: -40 }, { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "back.out(2)" }, C.team + 0.72);
          tl.fromTo("#s02-factory-leg2", { scale: 0.3, opacity: 0, x: -40 }, { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "back.out(2)" }, C.team + 1.12);

          // ---- belt: the camera pans down to the conveyor (viewport-change); the card visits five masters, each adds a colour ----
          to("#s02-factory-world", { y: 0 }, { y: -1080, duration: 0.8, ease: "power2.inOut" }, C.belt - 0.45);
          to("#s02-factory-bg", { y: 0 }, { y: -300, duration: 0.8, ease: "power2.inOut" }, C.belt - 0.45);
          to("#s02-factory-cat", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, C.belt - 0.6);   // scrolls out with the world, gone before it crosses the HUD band
          H.slam(tl, "#s02-factory-kw", C.belt, { dur: 0.34 });
          var colors = [P.mint, P.raspberry, P.tangerine, P.mint, P.sky], dots = all("#s02-factory-card i"), hops = all(".hop i"), cx = [405, 655, 905, 1155, 1405], card = id("card");
          all(".mst").forEach(function (m, n) {
            var root = xf(m.querySelector(".c-char")), arm = xf(m.querySelector(".c-arm-r")), at = C.belt + 0.67 + n * 0.55;
            xt(root, { y: 0 }, { y: -6, duration: 1.05, ease: "sine.inOut", yoyo: true, repeat: H.repeats(C._out - C.belt, 1.05) }, C.belt - 0.6 + n * 0.21);
            blink(m.querySelectorAll(".c-lid"), C.belt - 0.6, C._out, 30 + n);
            xt(arm, { r: 0 }, { r: -110, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, at - 0.12);
            xt(root, { h: 0 }, { h: -22, duration: 0.13, ease: "power2.out", yoyo: true, repeat: 1 }, at - 0.12);
            var tok = hops[n];
            tok.style.background = colors[n];
            tl.fromTo(tok, { y: 40, scale: 0, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.4)" }, at - 0.14);
            to(tok, { y: 0, scale: 1, opacity: 1 }, { y: 236, scale: 0.55, opacity: 0, duration: 0.2, ease: "power2.in" }, at + 0.04);
            tl.fromTo(dots[n], { backgroundColor: P.cream, scale: 1 }, { backgroundColor: colors[n], scale: 1.45, duration: 0.1, ease: "power2.out" }, at + 0.22);
            to(dots[n], { scale: 1.45 }, { scale: 1, duration: 0.24, ease: "back.out(3)" }, at + 0.32);
          });
          tl.fromTo(card, { x: 0 }, { x: cx[0], duration: 0.45, ease: "power2.out" }, C.belt + 0.22);
          for (k = 1; k < 5; k++) to(card, { x: cx[k - 1] }, { x: cx[k], duration: 0.28, ease: "power2.inOut" }, C.belt + 0.67 + (k - 1) * 0.55 + 0.3);
          to(card, { x: cx[4] }, { x: 1555, duration: 0.4, ease: "power2.inOut" }, C.belt + 2.87 + 0.3);
          to(card, { rotation: 0 }, { rotation: -4, duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1 }, C.belt + 2.87 + 0.7);

          // ---- «А главные решения…»: «вы» steps up at the end of the belt · you: the lemon «ВЫ» slams ----
          H.arrive(tl, "#s02-factory-vy", C.you - 1.75, { from: 0.4, y: 50, dur: 0.55 });
          var vy = id("vykit"), vroot = xf(vy.querySelector(".c-char")), varm = xf(vy.querySelector(".c-arm-r"));
          blink(vy.querySelectorAll(".c-lid"), C.you - 1.2, C._out, 77);
          xt(vroot, { y: 0 }, { y: -7, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: H.repeats(C._out - C.you + 1.1, 0.9) }, C.you - 1.1);
          H.slam(tl, "#s02-factory-you", C.you, { dur: 0.34 });
          xt(varm, { r: 0 }, { r: -105, duration: 0.3, ease: "back.out(2.5)" }, C.you + 0.02);
          tl.fromTo("#s02-factory-ring", { opacity: 0, scale: 0.4 }, { opacity: 0.95, scale: 0.4, duration: 0.01 }, C.you + 0.08);
          to("#s02-factory-ring", { scale: 0.4, opacity: 0.95 }, { scale: 1.5, opacity: 0, duration: 0.7, ease: "power2.out" }, C.you + 0.09);
          to("#s02-factory-you", { rotation: 0 }, { rotation: -3, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: H.repeats(C._out - C.you - 0.4, 0.6) }, C.you + 0.4);

          window.__timelines["s02-factory"] = tl;
        })();
      </script>
    </template>
