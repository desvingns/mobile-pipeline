<!doctype html>
<!-- Source template for compositions/hud.html (generated by scripts/build-video.cjs — edit HERE).
     HUD, design-video.md §6: runs from S02 to the end-card cut. Top-left chip «03 / 10 · Разговор»
     (swaps on every cut, above the wipes), top-right rail of 5 stations (upcoming = ring, active = ink
     pill, done = mint check) and a lemon dot on the station at each human «да».
     Placeholders: %%FONTS%% %%DUR%% %%MARKUP%% %%DATA%% ({chips:[{id,t}], states:[{t, st:[...]}], yes:[{t,i}]}). -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>hud</title>
  </head>
  <body>
    <template id="hud-template">
      <style>
        %%FONTS%%
        #hud {
          position: absolute;
          inset: 0;
          pointer-events: none;
          color: #16123a;
          font-family: "Golos Text", sans-serif;
        }
        #hud .hud-chip {
          position: absolute;
          left: 192px;
          top: 54px;
          height: 52px;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 24px 0 20px;
          background: #fff6e6;
          border: 3px solid #16123a;
          border-radius: 999px;
          box-shadow: 5px 5px 0 #16123a;
          white-space: nowrap;
          opacity: 0;
        }
        #hud .hud-num {
          display: block;
          font-family: "Unbounded", sans-serif;
          font-weight: 800;
          font-size: 26px;
          line-height: 1;
          letter-spacing: 0.01em;
        }
        #hud .hud-dot {
          display: block;
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: #16123a;
        }
        #hud .hud-name {
          display: block;
          font-weight: 700;
          font-size: 28px;
          line-height: 1;
        }
        #hud .hud-rail {
          position: absolute;
          right: 192px;
          top: 54px;
          height: 52px;
          display: flex;
          align-items: center;
          gap: 2px;
          padding: 0 4px;
          background: #fff6e6;
          border: 3px solid #16123a;
          border-radius: 999px;
          box-shadow: 5px 5px 0 #16123a;
          opacity: 0;
        }
        #hud .hud-st {
          position: relative;
          height: 38px;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 0 16px 0 9px;
          border-radius: 999px;
          background: #fff6e6;
          color: #16123a;
          font-weight: 700;
          font-size: 26px;
          line-height: 1;
          white-space: nowrap;
        }
        #hud .hud-ic {
          display: block;
          width: 24px;
          height: 24px;
          overflow: visible;
        }
        #hud .hud-yes {
          position: absolute;
          top: -13px;
          right: -7px;
          width: 22px;
          height: 22px;
          border-radius: 50%;
          background: #ffda4f;
          border: 3px solid #16123a;
          opacity: 0;
        }
        #hud .hud-yes-ring {
          position: absolute;
          top: -19px;
          right: -13px;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          border: 3px solid #ffda4f;
          opacity: 0;
        }
      </style>
      <div id="hud" data-composition-id="hud" data-width="1920" data-height="1080" data-duration="%%DUR%%">
%%MARKUP%%
      </div>
      <script>
        (function () {
          var DATA = %%DATA%%;
          var INK = "#16123A";
          var CREAM = "#FFF6E6";
          var tl = gsap.timeline({ paused: true });
          var chips = DATA.chips;

          // entrance: after the S02 morph reveal
          tl.fromTo("#hud-rail", { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)", immediateRender: false }, DATA.enter + 0.1);

          // chips: one per scene, swapped at every cut while the wipe covers the frame
          chips.forEach(function (c, i) {
            var el = document.getElementById(c.id);
            if (i === 0) {
              tl.fromTo(el, { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)", immediateRender: false }, DATA.enter);
            } else {
              tl.fromTo(el, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.34, ease: "back.out(2)", immediateRender: false }, c.t + 0.04);
            }
            var next = chips[i + 1];
            if (next) {
              tl.fromTo(el, { opacity: 1, y: 0 }, { opacity: 0, y: -20, duration: 0.16, ease: "power2.in", immediateRender: false }, next.t - 0.2);
            }
          });

          // station states: 0 upcoming, 1 active, 2 done
          var prev = null;
          DATA.states.forEach(function (s) {
            s.st.forEach(function (state, i) {
              var was = prev ? prev[i] : 0;
              if (state === was) return;
              var pill = "#hud-st-" + i;
              var at = s.t + 0.04;
              var bgFrom = was === 1 ? INK : CREAM, fgFrom = was === 1 ? CREAM : INK;
              var bgTo = state === 1 ? INK : CREAM, fgTo = state === 1 ? CREAM : INK;
              tl.fromTo(pill, { backgroundColor: bgFrom, color: fgFrom }, { backgroundColor: bgTo, color: fgTo, duration: 0.24, ease: "power2.out", immediateRender: false }, at);
              if (state === 1) tl.fromTo(pill, { scale: 1 }, { scale: 1.08, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
              var show = ["#hud-ic-" + i + " .ic-ring", "#hud-ic-" + i + " .ic-dot", "#hud-ic-" + i + " .ic-check"];
              tl.fromTo(show[was], { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, at);
              tl.fromTo(show[state], { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, at + 0.06);
            });
            prev = s.st;
          });

          // your «да»: lemon dot + one ring pulse on the station
          DATA.yes.forEach(function (y) {
            tl.fromTo("#hud-yes-" + y.i, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, y.t);
            tl.fromTo("#hud-yesr-" + y.i, { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.8, duration: 0.6, ease: "power2.out", immediateRender: false }, y.t + 0.05);
          });

          window.__timelines["hud"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
