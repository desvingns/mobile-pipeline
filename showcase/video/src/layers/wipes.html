<!doctype html>
<!-- Source template for compositions/wipes.html (generated by scripts/build-video.cjs — edit HERE).
     Scene transitions, design-video.md §4. One full-length overlay; scenes hard-cut underneath at T.
       blocks  : 2 slanted (12°) full-frame blocks, lead colour then the next scene's field; in 0.25 s each,
                 0.06 s apart, cover complete exactly at T; out from T+0.02, 0.28 s power3.inOut
       blocks5 : dense 5-block variant, 0.04 s stagger (T7)
       morph   : a disc of the next field grows from a point in the outgoing scene (with an ink rim),
                 covers at T, then dissolves to reveal the new scene (T1 bulb, T8 green lamp)
       dip     : ink dip into the end card; final: 0.8 s fade to ink (the film's only exit)
     Blocks are parked off-frame with CSS left (no CSS transform: GSAP owns x).
     Placeholders: %%DUR%% %%MARKUP%% %%DATA%% ({blocks:[...], morphs:[...], dip, final}). -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>wipes</title>
  </head>
  <body>
    <template id="wipes-template">
      <style>
        #wipes {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #wipes .wb {
          position: absolute;
          top: 0;
          width: 2400px;
          height: 1080px;
        }
        #wipes .wb-i {
          position: absolute;
          inset: 0;
          border-left: 10px solid #16123a;
          border-right: 10px solid #16123a;
          transform: skewX(-12deg);
        }
        #wipes .wm {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: visible;
        }
        #wipes .wdip,
        #wipes .wfinal {
          position: absolute;
          inset: 0;
          background: #16123a;
          opacity: 0;
        }
      </style>
      <div id="wipes" data-composition-id="wipes" data-width="1920" data-height="1080" data-duration="%%DUR%%">
%%MARKUP%%
      </div>
      <script>
        (function () {
          var DATA = %%DATA%%;
          var tl = gsap.timeline({ paused: true });
          var IN = 0.25, OUT = 0.28;

          DATA.blocks.forEach(function (w) {
            var n = w.ids.length;
            w.ids.forEach(function (id, k) {
              var tin = w.T - IN - (n - 1 - k) * w.stagger;
              var tout = w.T + 0.02 + k * w.stagger;
              tl.fromTo("#" + id, { x: 0 }, { x: w.dir * 2640, duration: IN, ease: "power3.inOut", immediateRender: false }, tin);
              tl.fromTo("#" + id, { x: w.dir * 2640 }, { x: w.dir * 5280, duration: OUT, ease: "power3.inOut", immediateRender: false }, tout);
            });
          });

          DATA.morphs.forEach(function (m) {
            tl.fromTo("#" + m.id + "-fill", { attr: { r: 0 } }, { attr: { r: m.r }, duration: 0.5, ease: "power3.in", immediateRender: false }, m.T - 0.5);
            tl.fromTo("#" + m.id + "-rim", { attr: { r: 0 } }, { attr: { r: m.r + 10 }, duration: 0.5, ease: "power3.in", immediateRender: false }, m.T - 0.52);
            tl.fromTo("#" + m.id, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, m.T + 0.02);
          });

          if (DATA.dip) {
            tl.fromTo("#wp-dip", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in", immediateRender: false }, DATA.dip.T - 0.3);
            tl.fromTo("#wp-dip", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, DATA.dip.T + 0.02);
          }
          tl.fromTo("#wp-final", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.in", immediateRender: false }, DATA.final.start);

          window.__timelines["wipes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
