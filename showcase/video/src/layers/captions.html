<!doctype html>
<!-- Source template for compositions/captions.html (generated by scripts/build-video.cjs — edit HERE).
     Karaoke captions, design-video.md §5: one pill per group, bottom edge at y=960, ≤2 lines, word turns
     lemon at its start and back to cream at its end. Placeholders: %%FONTS%% %%DUR%% %%MARKUP%%
     %%TRANSCRIPT%% (word timings, composition seconds) %%GROUPS%% ({in,out,w:[first,last]}). -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>captions</title>
  </head>
  <body>
    <template id="captions-template">
      <style>
        %%FONTS%%
        #captions {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        #captions .caption-group {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 120px;
          display: flex;
          justify-content: center;
          opacity: 0;
          visibility: hidden;
        }
        #captions .caption-line {
          display: block;
          max-width: 1360px;
          padding: 16px 32px;
          border-radius: 26px;
          background: rgba(22, 18, 58, 0.88);
          color: #fff6e6;
          font-family: "Golos Text", sans-serif;
          font-weight: 600;
          font-size: 46px;
          line-height: 1.26;
          word-spacing: 0.16em;
          text-align: center;
          text-wrap: balance;
          overflow: visible;
        }
        #captions .caption-night {
          box-shadow: 0 0 0 3px rgba(255, 246, 230, 0.34);
        }
        #captions .caption-word {
          display: inline-block;
          color: #fff6e6;
        }
        #captions .cw-keep {
          white-space: nowrap;
        }
      </style>
      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="%%DUR%%">
%%MARKUP%%
      </div>
      <script>
        (function () {
          var TRANSCRIPT = %%TRANSCRIPT%%;
          var GROUPS = %%GROUPS%%;
          var LEMON = "#FFDA4F";
          var CREAM = "#FFF6E6";
          var tl = gsap.timeline({ paused: true });
          GROUPS.forEach(function (g, gi) {
            var el = document.getElementById("cg-" + gi);
            tl.set(el, { visibility: "visible" }, g.in);
            tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, g.in);
            tl.to(el, { opacity: 0, duration: 0.08, ease: "power2.in" }, g.out - 0.08);
            tl.set(el, { opacity: 0, visibility: "hidden" }, g.out);
          });
          // karaoke: the spoken word is lemon (the reserved "active" colour), everything else cream
          TRANSCRIPT.forEach(function (w, wi) {
            var word = document.getElementById("cw-" + wi);
            // lit for at least 0.12 s, but a short word («в», «и») hands over the moment the next word starts,
            // so only one word is lemon at a time
            var nx = TRANSCRIPT[wi + 1];
            var off = Math.max(w.end, w.start + 0.12);
            if (nx && nx.start > w.start && nx.start < off) off = nx.start;
            tl.fromTo(word, { color: CREAM, scale: 1 }, { color: LEMON, scale: 1.05, duration: 0.08, ease: "power2.out", immediateRender: false }, w.start);
            tl.fromTo(word, { color: LEMON, scale: 1.05 }, { color: CREAM, scale: 1, duration: 0.12, ease: "power2.inOut", immediateRender: false }, off);
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
