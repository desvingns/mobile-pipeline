     Motion: grid-card-assemble (sheets self-assemble into a 6x3 wall, then the camera zoom-OUT modifier turns the
     wall into a board inside a vaster frame) + counting-dynamic-scale («≈18»), spring-pop-entrance (up to 5 advisors
     in one chord; 3 always run, the dashed 2 only if needed), stat-bars-and-fills (rings), ambient-glow-bloom, sine-wave-loop. -->

      <style>
        %%FONTS%%
        %%KITCSS%%

        #s04-blueprint .ribbon-t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff6e6; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 40px; letter-spacing: 0.01em; }
        #s04-blueprint .adv { top: 512px; width: 260px; height: 282px; }
        #s04-blueprint .ring { position: absolute; left: 10px; top: 0; }
        #s04-blueprint .adv-bob { position: absolute; left: 45px; top: 16px; width: 170px; height: 198px; }
        #s04-blueprint .adv-char { position: absolute; left: 0; top: 0; width: 170px; height: 198px; }
        #s04-blueprint .plate { position: absolute; left: 0; right: 0; top: 232px; display: flex; justify-content: center; }
        #s04-blueprint .plate span { display: block; padding: 4px 16px 5px; background: #fff6e6; border: 4px solid #16123a; border-radius: 999px; box-shadow: 4px 4px 0 #16123a; font-weight: 700; font-size: 26px; line-height: 1.1; white-space: nowrap; }
        #s04-blueprint .adv.opt .plate span { border-style: dashed; box-shadow: none; }
        #s04-blueprint .tag { left: 1140px; top: 446px; width: 540px; display: flex; justify-content: center; } #s04-blueprint .tag span { display: block; padding: 6px 26px 8px; border: 4px dashed #16123a; border-radius: 999px; font-weight: 700; font-size: 32px; line-height: 1.1; white-space: nowrap; }
        #s04-blueprint .badge { position: absolute; left: 196px; top: 6px; width: 54px; height: 54px; }

          <svg class="abs grid" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true"><path id="s04-blueprint-gmin" fill="none" stroke="#16123a" stroke-opacity="0.09" stroke-width="2" d="" /><path id="s04-blueprint-gmaj" fill="none" stroke="#16123a" stroke-opacity="0.16" stroke-width="3" d="" /></svg>
          <div class="abs" id="s04-blueprint-wall" style="left: 0; top: 0; width: 1920px; height: 1080px"><div id="s04-blueprint-slots"></div><div id="s04-blueprint-tiles"></div></div>

        <div class="abs adv" id="s04-blueprint-adv1" style="left: 530px"><div class="adv-bob"><div class="adv-char kit-rim">%%CHAR:sovetnik/glasses:170#s04-blueprint-a1%%</div></div><div class="plate"><span>Удобство</span></div></div>
        <div class="abs adv" id="s04-blueprint-adv2" style="left: 830px"><div class="adv-bob"><div class="adv-char kit-rim">%%CHAR:sovetnik/umbrella:170#s04-blueprint-a2%%</div></div><div class="plate"><span>Риски и&nbsp;сроки</span></div></div>
        <div class="abs adv opt" id="s04-blueprint-adv3" style="left: 1130px"><div class="adv-bob"><div class="adv-char kit-rim">%%CHAR:sovetnik/lock:170#s04-blueprint-a3%%</div></div><div class="plate"><span>Защита данных</span></div></div>
        <div class="abs adv opt" id="s04-blueprint-adv4" style="left: 1430px"><div class="adv-bob"><div class="adv-char kit-rim">%%CHAR:sovetnik/abacus:170#s04-blueprint-a4%%</div></div><div class="plate"><span>Статистика</span></div></div>
      </div>
      <script>
        (function () {
          %%HELPERS%%
          var C = %%CUES%%;
          var D = %%DUR%%, W = %%WORDS%%, H = window.MPV, P = H.C, OUT = C._out;
          var tl = gsap.timeline({ paused: true }), NIR = { immediateRender: false }, ID = "#s04-blueprint", rnd = H.rng(404);
          function el(id) { return document.getElementById("s04-blueprint-" + id); }
          function all(s) { return document.querySelectorAll(ID + " " + s); }
          function x(a, b) { var r = {}, k; for (k in a) r[k] = a[k]; for (k in b) r[k] = b[k]; return r; }
          function odd(n) { return n % 2 ? n : n + 1; }
          function at(stem, after, fb) { // first spoken word starting with `stem` at/after `after` (scene-local s)
            for (var i = 0; i < W.length; i++) if (W[i].start >= after && W[i].text.toLowerCase().replace(/[^а-яёa-z0-9-]/g, "").indexOf(stem) === 0) return W[i].start;
            return fb;
          }
          function hop(sel, t, h) {
            tl.fromTo(sel, { y: 0 }, x(NIR, { y: -h, duration: 0.16, ease: "power2.out" }), t);
            tl.fromTo(sel, { y: -h }, x(NIR, { y: 0, duration: 0.34, ease: "bounce.out" }), t + 0.16);
          }
          // ---- background layer (never frozen): seeded dots/pluses, ghost word, blueprint grid inside the world
          var dh = "", gmin = "", gmaj = "", g, i;
          for (i = 0; i < 24; i++) {
            var sz = (i % 3 ? 20 : 10) + Math.round(rnd() * 16);
            dh += '<i class="' + (i % 3 ? "plus" : "dot") + '" style="left:' + Math.round(rnd() * 1860) + "px;top:" + Math.round(90 + rnd() * 900) + "px;width:" + sz + "px;height:" + sz + 'px"></i>';
          }
          el("deco").innerHTML = dh;
          for (g = 0; g <= 1920; g += 60) { if (g % 240) gmin += "M" + g + " 0V1080"; else gmaj += "M" + g + " 0V1080"; }
          for (g = 0; g <= 1080; g += 60) { if (g % 240) gmin += "M0 " + g + "H1920"; else gmaj += "M0 " + g + "H1920"; }
          el("gmin").setAttribute("d", gmin); el("gmaj").setAttribute("d", gmaj);
          H.drift(tl, el("ghost"), 0, D, { x: -170 });
          H.drift(tl, el("deco"), 0, D, { y: -60, x: 24 });
          // ---- the 6x3 wall, built once (seeded): row 0 = what it does, 1 = how it looks, 2 = how to check
          var ROWC = [P.tangerine, P.violet, P.mint], TX0 = 960, TY0 = 175, TW = 113, TH = 150, TIL = [], slots = "", tiles = "";
          var INK = 'stroke="#16123a"', LINE = ' stroke="#16123a" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>';
          function icon(row, k) {
            var r2 = H.rng(900 + k), o = "", j, y;
            if (row === 0) for (j = 0; j < 4; j++) {
              y = 22 + j * 24;
              o += '<circle cx="22" cy="' + y + '" r="6" fill="#16123a"/><circle class="acc" cx="22" cy="' + y + '" r="6" fill="' + P.tangerine + '" ' + INK + ' stroke-width="3" opacity="0"/><path d="M36 ' + y + "h" + (34 + Math.round(r2() * 32)) + '"' + LINE;
            }
            if (row === 1) o = '<rect x="30" y="10" width="53" height="96" rx="11" fill="#fff6e6" ' + INK + ' stroke-width="4"/><rect x="38" y="20" width="37" height="12" rx="4" fill="#16123a" fill-opacity="0.25"/>' +
              '<rect class="acc" x="38" y="20" width="37" height="12" rx="4" fill="' + P.violet + '" opacity="0"/><rect x="38" y="' + (40 + Math.round(r2() * 6)) + '" width="37" height="22" rx="5" fill="#16123a" fill-opacity="0.14"/>' +
              '<circle class="acc" cx="56.5" cy="88" r="7" fill="' + P.sky + '" opacity="0"/><circle cx="56.5" cy="88" r="7" fill="none" ' + INK + ' stroke-width="3"/>';
            if (row === 2) for (j = 0; j < 3; j++) {
              y = 18 + j * 32;
              o += '<rect x="14" y="' + (y - 10) + '" width="22" height="22" rx="5" fill="#fff6e6" ' + INK + ' stroke-width="3.5"/><path d="M46 ' + (y + 1) + "h" + (26 + Math.round(r2() * 28)) + '"' + LINE +
                '<path class="chk" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M17 ' + (y + 1) + ' l6 6 l12 -15" fill="none" ' + INK + ' stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
            }
            return '<svg width="105" height="106" viewBox="0 0 113 114" aria-hidden="true">' + o + "</svg>";
          }
          for (i = 0; i < 18; i++) {
            var r = Math.floor(i / 6), lx = TX0 + (i % 6) * (TW + 18), ly = TY0 + r * (TH + 36), pos = 'style="left:' + lx + "px;top:" + ly + 'px"';
            slots += '<div class="abs slot" ' + pos + "></div>";
            tiles += '<div class="abs tile" id="s04-blueprint-t' + i + '" ' + pos + '><div class="tile-in"><div class="strip"></div><div class="strip lit" style="background:' + ROWC[r] + '"></div>' + icon(r, i) + "</div></div>";
            TIL.push({ x: lx, y: ly });
          }
          el("slots").innerHTML = slots; el("tiles").innerHTML = tiles;
          // ---- Phase A: the scribes arrive; two of your answers from the talk fly into the scroll («из ваших ответов»)
          H.arrive(tl, el("pisar"), 0.12, { from: 0.4, y: 60 });
          H.arrive(tl, el("buddy"), 0.3, { from: 0.4, y: 50 });
          H.slam(tl, el("pl"), C.scribes + 0.05);
          H.bob(tl, el("pisar"), 0.8, OUT, { y: 7, period: 2.2 }); H.bob(tl, el("buddy"), 0.9, OUT, { y: 5, period: 1.9 });
          H.blink(tl, "#s04-blueprint-kit .c-lid", 0.6, OUT, { seed: 41 }); H.blink(tl, "#s04-blueprint-kit2 .c-lid", 0.9, OUT, { seed: 42 });
          [[-30, 330], [-170, 225]].forEach(function (d, b) {
            tl.fromTo(el("bub" + b), { x: -520, y: 40, rotation: -8, opacity: 0, scale: 0.9 }, { x: 0, y: 0, rotation: b ? 3 : -3, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.35 + b * 0.3);
            tl.fromTo(el("bub" + b), { x: 0, y: 0, scale: 1, opacity: 1 }, x(NIR, { x: d[0], y: d[1], scale: 0.1, opacity: 0, duration: 0.42, ease: "power3.in" }), C.scribes - 0.4 + b * 0.12);
          });
          // scribes: both hop, then the quills write until the count lands
          hop("#s04-blueprint-pisar > .kit-rim", C.scribes, 22); hop("#s04-blueprint-buddy > .kit-rim", C.scribes + 0.1, 16);
          tl.fromTo("#s04-blueprint-kit .c-arm-r", { rotation: 0 }, x(NIR, { rotation: -24, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: odd(H.repeats(C.n18 + 0.5 - C.scribes, 0.18)) }), C.scribes);
          tl.fromTo("#s04-blueprint-kit2 .c-arm-r", { rotation: 0 }, x(NIR, { rotation: -14, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: odd(H.repeats(C.n18 + 0.5 - C.scribes, 0.22)) }), C.scribes + 0.2);
          // docs: 18 sheets fly from the quill tip into their slots (x and y on different eases = a curved flight)
          var QX = 568, QY = 553, FLY = 0.62, GAP = 0.052;
          TIL.forEach(function (t, n) {
            var e = el("t" + n), t0 = C.docs + n * GAP;
            tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, t0);
            tl.fromTo(e, { x: QX - t.x - TW / 2 }, x(NIR, { x: 0, duration: FLY, ease: "power2.out" }), t0);
            tl.fromTo(e, { y: QY - t.y - TH / 2 }, x(NIR, { y: 0, duration: FLY, ease: "back.out(1.3)" }), t0);
            tl.fromTo(e, { rotation: -60 + rnd() * 30, scale: 0.18 }, x(NIR, { rotation: 0, scale: 1, duration: FLY, ease: "back.out(1.4)" }), t0);
          });
          // counting-dynamic-scale: the count tracks the landings, its scale grows with it, «≈» lands after the count
          var CT0 = C.docs + FLY * 0.55, CTD = C.docs + 17 * GAP + FLY - CT0;
          H.arrive(tl, el("count"), CT0 - 0.2, { from: 0.8, dur: 0.3 });
          // property tween (not an onUpdate callback): the runtime seeks with suppressed events, so a count driven
          // by a callback freezes on its last in-flight value after a jump; innerText+snap is rendered on any seek
          tl.fromTo(el("num"), { innerText: 0 }, { innerText: 18, snap: { innerText: 1 }, duration: CTD, ease: "power2.out" }, CT0);
          tl.fromTo(el("grow"), { scale: 0.5 }, x(NIR, { scale: 1, duration: CTD, ease: "power2.out" }), CT0);
          tl.fromTo(el("lbl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, CT0 + 0.35);
          tl.fromTo(el("approx"), { opacity: 0, scale: 0.3, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.8)" }, CT0 + CTD);
          // what / look / check: the row's chip slams, its tiles light up in a left-to-right wave
          [C.what, C.look, C.check].forEach(function (tb, row) {
            H.slam(tl, el("chip" + row), tb, { dur: 0.32 });
            for (var c = 0; c < 6; c++) {
              var tt = tb + 0.08 + c * 0.045, b = ID + "-t" + (row * 6 + c);
              tl.fromTo(b + " .tile-in", { y: 0, scale: 1 }, x(NIR, { y: -16, scale: 1.06, duration: 0.14, ease: "power2.out" }), tt);
              tl.fromTo(b + " .tile-in", { y: -16, scale: 1.06 }, x(NIR, { y: 0, scale: 1, duration: 0.42, ease: "back.out(2.2)" }), tt + 0.14);
              tl.fromTo(b + " .lit", { opacity: 0 }, x(NIR, { opacity: 1, duration: 0.12, ease: "none" }), tt);
              if (row < 2) tl.fromTo(b + " .acc", { opacity: 0 }, x(NIR, { opacity: 1, duration: 0.12 }), tt + 0.06);
              else tl.fromTo(b + " .chk", { strokeDashoffset: 1 }, x(NIR, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out", stagger: 0.07 }), tt + 0.1);
            }
          });
          // the finished blueprint breathes (sine-wave-loop, tiny amplitude for 18 tiles) + one traveling sheen
          tl.fromTo(el("wall"), { y: 0 }, x(NIR, { y: -5, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: H.repeats(OUT - C.check - 0.8, 1.1) }), C.check + 0.8);
          tl.fromTo(el("sheen"), { x: 0, rotation: 14 }, x(NIR, { x: 1500, rotation: 14, duration: 1.0, ease: "power2.inOut" }), C.check + 0.95);
          // ---- camera zoom-OUT: world crop (150,115)-(1770,800) lands on the board rect (636,140) 648x274 = scale 0.4
          var A = C.advisors, ZD = 0.8, ZT = A - ZD - 0.06;
          tl.fromTo(el("world"), { x: 0, y: 0, scale: 1, clipPath: "inset(0px 0px 0px 0px round 0px)" },
            x(NIR, { x: 576, y: 94, scale: 0.4, clipPath: "inset(115px 150px 280px 150px round 64px)", duration: ZD, ease: "power2.inOut" }), ZT);
          tl.fromTo(el("frame"), { opacity: 0, scale: 1.04 }, x(NIR, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }), ZT + ZD - 0.2);
