      <script>
        (function () {
          %%HELPERS%%
          var C = %%CUES%%;
          var D = %%DUR%%;
          var H = window.MPV;
          var tl = gsap.timeline({ paused: true });
          var P = H.C, NS = "http://www.w3.org/2000/svg", i, k, el;
          var id = function (s) { return document.getElementById("s02-factory-" + s); }, all = function (s) { return document.querySelectorAll("#s02-factory " + s); };
          function ext(a, b) { var r = {}, n; for (n in a) r[n] = a[n]; for (n in b) r[n] = b[n]; return r; }
          function to(e, f, v, t) { return tl.fromTo(e, f, ext({ immediateRender: false }, v), t); }
          // xf(): SVG-internal parts move by a CSS transform written from a GSAP-tweened proxy, so the pivot comes from CSS
          // transform-box/origin (kit chars.css or the .vb rules) and never from a bbox GSAP would read at build time (it is 0 there).
          function xf(tg, init) {
            var els = typeof tg === "string" ? document.querySelectorAll(tg) : (tg.length != null ? tg : [tg]), st = ext({ x: 0, y: 0, h: 0, r: 0, s: 1, sx: 1, sy: 1, o: null }, init || {});
            st.apply = function () { var t = "translate(" + st.x.toFixed(2) + "px," + (st.y + st.h).toFixed(2) + "px) rotate(" + st.r.toFixed(2) + "deg) scale(" + (st.s * st.sx).toFixed(4) + "," + (st.s * st.sy).toFixed(4) + ")";
              for (var m = 0; m < els.length; m++) { els[m].style.transform = t; if (st.o != null) els[m].style.opacity = String(Math.round(st.o * 1000) / 1000); } };
            st.apply(); return st;
          }
          function xt(st, f, v, t) { return tl.fromTo(st, f, ext(v, { immediateRender: false, onUpdate: st.apply }), t); }
          function blink(lids, from, until, seed) {
            for (var st = xf(lids), r = H.rng(seed), t = from + 0.3 + r() * 1.2; t + 0.12 < until; t += 2.4 + r() * 1.8) { xt(st, { sy: 1 }, { sy: 0.1, duration: 0.05, ease: "power1.in" }, t); xt(st, { sy: 0.1 }, { sy: 1, duration: 0.06, ease: "power1.out" }, t + 0.05); }
          }
          function gearPath(r, teeth) {
            for (var d = "", n = teeth * 2, j = 0; j < n; j++) { var a0 = (j / n) * Math.PI * 2, a1 = ((j + 1) / n) * Math.PI * 2, rr = j % 2 ? r * 0.8 : r; d += (j ? "L" : "M") + (rr * Math.cos(a0)).toFixed(1) + " " + (rr * Math.sin(a0)).toFixed(1) + "L" + (rr * Math.cos(a1)).toFixed(1) + " " + (rr * Math.sin(a1)).toFixed(1); }
            return d + "Z";
          }

          // ---- setup (seeded): gears, dots, pluses; the factory gear; 49 catalogue tiles cloned from the kit library ----
          var bg = id("bg"), rng = H.rng(202), gears = [];
          [[60, 120, 190], [1640, 60, 240], [1720, 760, 170], [90, 900, 210], [1500, 1260, 230], [120, 1380, 180]].forEach(function (g) {
            el = document.createElementNS(NS, "svg"); el.setAttribute("class", "gear"); el.setAttribute("viewBox", "-110 -110 220 220");
            el.style.left = g[0] + "px"; el.style.top = g[1] + "px"; el.style.width = el.style.height = g[2] + "px";
            el.innerHTML = '<path d="' + gearPath(100, 10) + '" fill="#FFF6E6"/><circle r="34" fill="#5B34F5"/>'; bg.appendChild(el); gears.push(xf(el));
          });
          for (i = 0; i < 34; i++) {
            el = document.createElement("span"); el.className = i % 2 ? "plus" : "dot"; el.style.width = el.style.height = (i % 2 ? 18 + rng() * 12 : 9 + rng() * 12).toFixed(0) + "px";
            el.style.left = (60 + rng() * 1800).toFixed(0) + "px"; el.style.top = (130 + rng() * 1300).toFixed(0) + "px"; id("dots").appendChild(el);
          }
          id("fgear").innerHTML = '<path d="' + gearPath(26, 8) + '" transform="translate(471 104)" fill="#2BD99F" stroke="#16123A" stroke-width="5" stroke-linejoin="round"/><circle cx="471" cy="104" r="8" fill="#FFF6E6" stroke="#16123A" stroke-width="4"/>';
          for (var lib = id("lib").querySelectorAll("svg.kit"), grid = id("grid"), tiles = [], tr = H.rng(49), i = 0; i < 49; i++) {   // 22 blueprint masters (sky), 27 build masters (tangerine)
            var spec = i < 22, pick = spec ? (i * 7 + Math.floor(tr() * 10)) % 10 : 10 + (i * 7 + Math.floor(tr() * 11)) % 11, tile = document.createElement("div");
            el = document.createElement("div"); el.className = "slot"; el.style.left = ((i % 7) * 74) + "px"; el.style.top = (Math.floor(i / 7) * 86) + "px"; grid.appendChild(el);
            tile.className = "tile"; tile.style.left = ((i % 7) * 74) + "px"; tile.style.top = (Math.floor(i / 7) * 86) + "px"; tile.style.background = spec ? P.sky : P.tangerine;
            tile.appendChild(lib[pick].cloneNode(true)); grid.appendChild(tile); tiles.push(tile);
          }

          // ---- background life ----
          gears.forEach(function (g, n) { xt(g, { r: 0 }, { r: (n % 2 ? -1 : 1) * 70, duration: D, ease: "none" }, 0); });
          H.drift(tl, "#s02-factory-dots", 0, D, { x: -60, y: -30 });
          xt(xf("#s02-factory-beltsvg .belt-chev"), { x: 0 }, { x: 28, duration: 0.3, ease: "none", repeat: H.repeats(D, 0.3) }, 0);
          xt(xf("#s02-factory-beltsvg .belt-roller"), { r: 0 }, { r: 360, duration: 1.2, ease: "none", repeat: H.repeats(D, 1.2) }, 0);
          xt(xf("#s02-factory-fgear"), { r: 0 }, { r: 240, duration: D, ease: "none" }, 0);

          // ---- 0.1 -> brand: the letters float in scattered, then snap together on «Мобайл Пайплайн» (logo-assemble) ----
          all("#s02-factory-word span:not(.sp)").forEach(function (L, n, lr) {
            lr = H.rng(7 + n * 13);
            var sx = (lr() - 0.5) * 1300, sy = -30 + lr() * 400, rot = (lr() - 0.5) * 160, t0 = 0.12 + n * 0.05;
            tl.fromTo(L, { x: sx, y: sy, rotation: rot, scale: 0, opacity: 0 }, { x: sx * 0.86, y: sy * 0.86, rotation: rot * 0.8, scale: 0.72, opacity: 1, duration: 0.45, ease: "back.out(2)" }, t0);
            to(L, { x: sx * 0.86, y: sy * 0.86, rotation: rot * 0.8, scale: 0.72 }, { x: sx * 0.7, y: sy * 0.7, rotation: rot * 0.6, scale: 0.78, duration: C.brand - 0.26 - t0 - 0.45, ease: "sine.inOut" }, t0 + 0.45);
            to(L, { x: sx * 0.7, y: sy * 0.7, rotation: rot * 0.6, scale: 0.78 }, { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.26, ease: "power4.in" }, C.brand - 0.26);
          });
          to("#s02-factory-word", { scale: 1, y: 0 }, { scale: 1.07, y: -6, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, C.brand);
          tl.fromTo("#s02-factory-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, C.brand + 0.08);

          // ---- factory: the chip and the factory rise, windows switch on, smoke puffs ----
          tl.fromTo("#s02-factory-pill", { scale: 0.4, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.9)" }, C.factory - 0.05);
          tl.fromTo("#s02-factory-fac", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, C.factory + 0.05);
          document.querySelectorAll("#s02-factory-wins rect, #s02-factory-wins circle").forEach(function (w, n) { tl.fromTo(w, { attr: { fill: P.cream } }, { attr: { fill: n % 2 ? P.mint : P.sky }, duration: 0.01 }, C.factory + 0.55 + n * 0.12); });
          document.querySelectorAll("#s02-factory .puff").forEach(function (p, n) {
            var st = xf(p, { s: 0.4, o: 0 }), pd = { p: 0 };
            tl.fromTo(pd, { p: 0 }, { p: 1, duration: 1.5, ease: "none", immediateRender: false, repeat: H.repeats(C.n49 - C.factory - 0.8 - n * 0.5, 1.5), onUpdate: function () {
              var q = pd.p; st.y = -50 * q; st.x = 160 * q; st.s = 0.4 + q; st.o = q < 0.15 ? q / 0.15 * 0.95 : 0.95 * (1 - (q - 0.15) / 0.85); st.apply(); } }, C.factory + 0.6 + n * 0.5);
          });

          // ---- «В её каталоге»: the camera dives through the factory door (it fills the frame with ink), the catalogue opens behind it ----
          to("#s02-factory-ext", { scale: 1 }, { scale: 34, duration: 0.62, ease: "power3.in" }, C.n49 - 1.1);
          to("#s02-factory-ext", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, C.n49 - 0.48);
          to("#s02-factory-knob", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, C.n49 - 0.9);
          tl.fromTo("#s02-factory-cat", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, C.n49 - 0.46);

          // ---- n49: «49» counts up while it grows (counting-dynamic-scale) · team: the grid blooms from the centre ----
          var n49 = id("n49"), box = { v: 0 };
          tl.fromTo(box, { v: 0 }, { v: 49, duration: 1.2, ease: "power3.out", immediateRender: false, onUpdate: function () { n49.textContent = String(Math.round(box.v)); } }, C.n49);
          tl.fromTo("#s02-factory-n49", { scale: 0.5 }, { scale: 1, duration: 1.2, ease: "power3.out" }, C.n49);
          H.slam(tl, "#s02-factory-lbl", C.team, { dur: 0.34 });
          tiles.forEach(function (t, n) {
            var col = n % 7, row = Math.floor(n / 7), ring = Math.max(Math.abs(col - 3), Math.abs(row - 3));
            tl.fromTo(t, { x: (3 - col) * 74 * 0.55, y: (3 - row) * 86 * 0.55, scale: 0, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, C.team - 0.05 + ring * 0.1 + tr() * 0.06);
            to(t, { y: 0 }, { y: -14, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, (n < 22 ? C.team + 0.78 : C.team + 1.18) + col * 0.025);

          tl.fromTo("#s02-factory-leg2", { scale: 0.3, opacity: 0, x: -40 }, { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "back.out(2)" }, C.team + 1.12);

          // ---- belt: the camera pans down to the conveyor (viewport-change); the card visits five masters, each adds a colour ----
          to("#s02-factory-world", { y: 0 }, { y: -1080, duration: 0.8, ease: "power2.inOut" }, C.belt - 0.45);
          to("#s02-factory-bg", { y: 0 }, { y: -300, duration: 0.8, ease: "power2.inOut" }, C.belt - 0.45);

          tl.fromTo(card, { x: 0 }, { x: cx[0], duration: 0.45, ease: "power2.out" }, C.belt + 0.22);

          to("#s02-factory-you", { rotation: 0 }, { rotation: -3, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: H.repeats(C._out - C.you - 0.4, 0.6) }, C.you + 0.4);
